name: Shared Claude credential probe
run-name: shared-morty-${{ github.actor_id }}-shared-probe-${{ github.run_id }}
on:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: shared-morty-${{ github.actor_id }}
    cancel-in-progress: false
jobs:
    probe:
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version-file: .nvmrc
            - run: corepack pnpm install --frozen-lockfile
            - run: npm install --global @anthropic-ai/claude-code@2.1.323
            - run: node experiments/claude-shared-probe.mjs
              env:
                  SHARED_CLAUDE_TOKEN: ${{ secrets.SHARED_CLAUDE_TOKEN }}
