name: State design experiments
run-name: state-experiment-${{ github.run_number }}-${{ github.actor_id }}

on:
  push:
    branches: [codex/workflow-state-experiments]

permissions:
  contents: write
  actions: read

env:
  EXPERIMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  GH_REPOSITORY: ${{ github.repository }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node experiments/github-state.mjs initialize

  lock-contender:
    needs: initialize
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        contender: [one, two, three]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node experiments/github-state.mjs contend ${{ matrix.contender }}

  verify-lock-and-recovery:
    needs: lock-contender
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node experiments/github-state.mjs verify

  user-slots:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: same-user-first
            subject: actual-actor
          - label: same-user-second
            subject: actual-actor
          - label: other-group
            subject: simulated-other-user
    concurrency:
      group: sm-exp-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.subject == 'actual-actor' && github.actor_id || matrix.subject }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node experiments/github-state.mjs slot ${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: slot-${{ matrix.label }}
          path: experiment-result.json
          retention-days: 7

  verify-user-slots:
    needs: user-slots
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: slot-*
          path: slot-results
      - run: node experiments/github-state.mjs verify-slots

  cache-save:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        subject: [alice, bob]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node experiments/github-state.mjs cache-save ${{ matrix.subject }}
      - uses: actions/cache/save@v4
        with:
          path: fixture-cache
          key: sm-exp-${{ env.EXPERIMENT_ID }}-${{ matrix.subject }}

  cache-restore:
    needs: cache-save
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        subject: [alice, bob]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: fixture-cache
          key: sm-exp-${{ env.EXPERIMENT_ID }}-${{ matrix.subject }}
          fail-on-cache-miss: true
      - run: node experiments/github-state.mjs cache-restore ${{ matrix.subject }}

  codex-real-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global @openai/codex@0.154.0
      - run: node experiments/codex-auth.mjs

  cleanup:
    if: always()
    needs: [verify-lock-and-recovery, verify-user-slots, cache-restore, codex-real-binary]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node experiments/github-state.mjs cleanup
